<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Live Prices ⚡</title>
<style>
  :root { --bg:#0b0e14; --panel:#141924; --panel2:#1c2431; --line:#263041; --txt:#e6edf3; --dim:#8b98a9; --up:#2ec26b; --down:#ff5470; --accent:#6ea8fe; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  .row1 { display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; white-space:nowrap; }
  .status { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); margin-left:auto; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--down); }
  .dot.live { background:var(--up); box-shadow:0 0 8px var(--up); }
  .searchbar { display:flex; gap:8px; margin-top:9px; }
  .searchbar input { flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--txt); padding:10px 12px; border-radius:9px; font-size:15px; outline:none; }
  .searchbar input:focus { border-color:var(--accent); }
  .searchbar button { background:var(--accent); color:#06101f; border:0; padding:0 16px; border-radius:9px; font-weight:600; font-size:15px; }
  #results { background:var(--panel2); border:1px solid var(--line); border-radius:10px; margin:9px 14px 0; overflow:hidden; display:none; }
  #results div { padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; font-size:14px; }
  #results div:active { background:var(--panel); }
  #results small { color:var(--dim); }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; padding:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .card .q { font-size:14px; font-weight:600; margin-bottom:3px; }
  .card .meta { font-size:11px; color:var(--dim); margin-bottom:11px; display:flex; justify-content:space-between; }
  .card .x { cursor:pointer; padding:0 4px; }
  .card .x:active { color:var(--down); }
  .outcome { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:10px; background:var(--panel2); margin-bottom:7px; }
  .outcome .name { font-weight:600; font-size:14px; max-width:55%; }
  .prices { text-align:right; font-variant-numeric:tabular-nums; }
  .prob { font-size:28px; font-weight:700; letter-spacing:-.5px; }
  .delta { font-size:12px; margin-left:6px; }
  .sub { font-size:10px; color:var(--dim); }
  .flash-up { animation:fu .5s; } .flash-down { animation:fd .5s; }
  @keyframes fu { 0%{background:rgba(46,194,107,.4);} 100%{background:var(--panel2);} }
  @keyframes fd { 0%{background:rgba(255,84,112,.4);} 100%{background:var(--panel2);} }
  .up { color:var(--up); } .down { color:var(--down); }
  .empty { color:var(--dim); padding:40px 18px; text-align:center; grid-column:1/-1; }
  .age { font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <div class="row1">
    <h1>⚡ Live Prices</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></span>
  </div>
  <div class="searchbar">
    <input id="q" placeholder="Search any market — bitcoin, a team, an event…" autocomplete="off" />
    <button id="go">Search</button>
  </div>
</header>
<div id="results"></div>
<main id="board"><div class="empty">Loading popular sports & crypto markets… or search any market above.</div></main>

<script>
const GAMMA = 'https://gamma-api.polymarket.com';
const WS_URL = 'wss://ws-subscriptions-clob.polymarket.com/ws/market';
const watch = new Map();
const assetToMarket = new Map();
let ws = null, reconnectT = null;

const qEl = document.getElementById('q'), resEl = document.getElementById('results');
function setStatus(live, text){ document.getElementById('dot').className='dot'+(live?' live':''); document.getElementById('statusText').textContent=text; }
function isLive(m){ let p; try{p=JSON.parse(m.outcomePrices||'[]');}catch{p=[];} const res=p.length&&p.every(x=>+x===0||+x===1); return m.clobTokenIds && m.acceptingOrders!==false && !res; }

// ---- comprehensive search (Polymarket's own public-search) ----
async function search(){
  const term = qEl.value.trim(); if(!term) return;
  resEl.style.display='block'; resEl.innerHTML='<div>Searching…</div>';
  try {
    const j = await (await fetch(`${GAMMA}/public-search?q=${encodeURIComponent(term)}`)).json();
    const items = [];
    for(const ev of j.events||[]) for(const m of ev.markets||[]) if(isLive(m)) items.push({ ev, m });
    if(!items.length){ resEl.innerHTML='<div>No live markets match that.</div>'; return; }
    resEl.innerHTML='';
    for(const {ev, m} of items.slice(0,30)){
      const d=document.createElement('div');
      d.innerHTML = `${m.question} <small>${ev.title!==m.question?'· '+ev.title:''}</small>`;
      d.onclick=()=>{ addMarket(m, true); resEl.style.display='none'; qEl.value=''; qEl.blur(); };
      resEl.appendChild(d);
    }
  } catch(e){ resEl.innerHTML=`<div>Search failed: ${e.message}</div>`; }
}
document.getElementById('go').onclick=search;
qEl.addEventListener('keydown',e=>{ if(e.key==='Enter') search(); });
document.addEventListener('click',e=>{ if(!resEl.contains(e.target)&&e.target!==qEl&&e.target.id!=='go') resEl.style.display='none'; });

// ---- add / remove a market ----
// `fromSearch` markets are put at the TOP and scrolled to, so on a phone you
// immediately see the one you just tapped (instead of it landing off-screen
// below the auto-loaded cards, which looked like "nothing happened").
function addMarket(m, fromSearch=false){
  const id = String(m.id || m.conditionId || m.clobTokenIds);
  if(watch.has(id)){ const w=watch.get(id); w.card.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  let tokenIds, outcomes;
  try {
    tokenIds = Array.isArray(m.clobTokenIds) ? m.clobTokenIds : JSON.parse(m.clobTokenIds);
    outcomes = Array.isArray(m.outcomes) ? m.outcomes : JSON.parse(m.outcomes||'["Yes","No"]');
  } catch { return; }
  const board=document.getElementById('board');
  if(board.querySelector('.empty')) board.innerHTML='';
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<div class="q">${m.question}</div>
    <div class="meta"><span>updated <span class="age" data-age>—</span></span><span class="x">✕</span></div>
    <div class="rows"></div>`;
  const rows=card.querySelector('.rows'); const rowEls={};
  tokenIds.forEach((tid,i)=>{
    const row=document.createElement('div'); row.className='outcome';
    row.innerHTML=`<span class="name">${outcomes[i]??'Outcome '+i}</span>
      <span class="prices"><span class="prob" data-prob>—</span><span class="delta" data-delta></span><div class="sub" data-sub></div></span>`;
    rows.appendChild(row); rowEls[tid]=row; assetToMarket.set(tid,id);
  });
  card.querySelector('.x').onclick=()=>removeMarket(id);
  if(fromSearch) board.insertBefore(card, board.firstChild); else board.appendChild(card);
  watch.set(id,{ question:m.question, tokenIds, outcomes, card, rowEls,
    books:Object.fromEntries(tokenIds.map(t=>[t,{bids:new Map(),asks:new Map(),last:null}])), prob:{}, lastUpdate:0 });
  if(fromSearch) card.scrollIntoView({behavior:'smooth',block:'center'});
  resubscribe();
}
function removeMarket(id){
  const w=watch.get(id); if(!w) return; w.card.remove();
  w.tokenIds.forEach(t=>assetToMarket.delete(t)); watch.delete(id);
  if(!watch.size) document.getElementById('board').innerHTML='<div class="empty">Search any market above to start watching.</div>';
  resubscribe();
}

// ---- auto-load popular sports + crypto on open ----
async function autoLoad(){
  try {
    const actives = await (await fetch(`${GAMMA}/markets?active=true&closed=false&limit=200&order=volume24hr&ascending=false`)).json();
    let added=0;
    for(const m of actives){
      if(added>=14) break;
      if(!isLive(m)) continue;
      const q=(m.question||'').toLowerCase();
      const sport = / vs\.? /i.test(q);
      const crypto = /up or down/.test(q) && /(bitcoin|ethereum|\bbnb\b|\bsol)/.test(q);
      if(sport||crypto){ addMarket(m); added++; }
    }
    const emptyEl = document.getElementById('board').querySelector('.empty');
    if(!added && emptyEl) emptyEl.textContent='Search any market above to start watching.';
  } catch {}
}

// ---- websocket (real-time, ms) ----
function connect(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{ setStatus(true,'live'); resubscribe(); };
  ws.onclose=()=>{ setStatus(false,'reconnecting…'); clearTimeout(reconnectT); reconnectT=setTimeout(connect,1200); };
  ws.onerror=()=>{ try{ws.close();}catch{} };
  ws.onmessage=onMessage;
}
function resubscribe(){ if(!ws||ws.readyState!==1) return; const ids=[...assetToMarket.keys()]; if(ids.length) ws.send(JSON.stringify({assets_ids:ids,type:'market'})); }
function bestBidOnly(b){let x=null;for(const[p,s]of b.bids)if(s>0){const n=+p;if(x===null||n>x)x=n;}return x;}
function bestAskOnly(b){let x=null;for(const[p,s]of b.asks)if(s>0){const n=+p;if(x===null||n<x)x=n;}return x;}
function bestMid(book){ const bid=bestBidOnly(book), ask=bestAskOnly(book); return bid!=null&&ask!=null?(bid+ask)/2:(bid??ask??book.last); }
function onMessage(ev){
  let arr; try{arr=JSON.parse(ev.data);}catch{return;} if(!Array.isArray(arr))arr=[arr];
  const touched=new Set();
  for(const e of arr){
    const id=assetToMarket.get(e.asset_id); if(!id) continue;
    const w=watch.get(id); const book=w.books[e.asset_id]; if(!book) continue;
    if(e.event_type==='book'){ book.bids.clear();book.asks.clear();
      for(const l of e.bids||[])book.bids.set(l.price,+l.size); for(const l of e.asks||[])book.asks.set(l.price,+l.size);
      if(e.last_trade_price!=null)book.last=+e.last_trade_price;
    } else if(e.event_type==='price_change'){
      for(const c of (e.changes||(e.price!=null?[e]:[]))){ const side=(c.side||'').toUpperCase()==='SELL'?'asks':'bids'; const sz=+c.size; if(sz>0)book[side].set(c.price,sz); else book[side].delete(c.price); }
    } else if(e.event_type==='last_trade_price'){ if(e.price!=null)book.last=+e.price; }
    w.lastUpdate=performance.now(); touched.add(id);
  }
  for(const id of touched) render(id);
}
function render(id){
  const w=watch.get(id); if(!w) return;
  w.tokenIds.forEach(tid=>{
    const book=w.books[tid]; const mid=bestMid(book); if(mid==null) return;
    const prob=mid*100, row=w.rowEls[tid], el=row.querySelector('[data-prob]'), prev=w.prob[tid];
    el.textContent=prob.toFixed(1)+'%';
    if(prev!=null&&Math.abs(prob-prev)>0.001){
      const up=prob>prev; row.classList.remove('flash-up','flash-down'); void row.offsetWidth; row.classList.add(up?'flash-up':'flash-down');
      const d=row.querySelector('[data-delta]'); const diff=prob-prev; d.textContent=(diff>0?'▲':'▼')+Math.abs(diff).toFixed(1); d.className='delta '+(up?'up':'down');
    }
    w.prob[tid]=prob;
    const bid=bestBidOnly(book), ask=bestAskOnly(book);
    row.querySelector('[data-sub]').textContent=`bid ${bid!=null?(bid*100).toFixed(1):'—'} · ask ${ask!=null?(ask*100).toFixed(1):'—'}`;
  });
}

setInterval(()=>{ const now=performance.now(); for(const w of watch.values()){ const el=w.card.querySelector('[data-age]'); if(!el)continue; const ms=w.lastUpdate?now-w.lastUpdate:null; el.textContent=ms==null?'—':ms<1000?Math.round(ms)+'ms ago':(ms/1000).toFixed(1)+'s ago'; el.style.color=ms!=null&&ms<2500?'var(--up)':'var(--dim)'; } },100);

// Re-subscribe every 8s: Polymarket replies with a fresh book snapshot for
// each market, which keeps quiet markets' prices/timestamps current (so a
// market that simply hasn't traded still reads "fresh", not stale). Active
// markets keep updating in real time via the push stream between these.
setInterval(resubscribe, 8000);

connect();
autoLoad();
</script>
</body>
</html>
