<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Polymarket Live ⚡</title>
<style>
  :root{
    --bg:#0a0d13; --panel:#141924; --panel2:#1b2330; --line:#243044;
    --txt:#e8eef6; --dim:#8a97a9; --up:#2ee6a0; --down:#ff5c7a;
    --accent:#7aa2ff; --live:#ff4d4d; --gold:#ffcf5c;
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0a0d13 70%,rgba(10,13,19,.9));
    border-bottom:1px solid var(--line);padding:10px 16px 8px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:.3px;white-space:nowrap}
  h1 .z{color:var(--accent)}
  .search{flex:1;min-width:180px;position:relative}
  .search input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:9px 12px 9px 34px;border-radius:10px;font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--down);transition:background .3s}
  .dot.on{background:var(--up);box-shadow:0 0 9px var(--up)}
  .lat{font-variant-numeric:tabular-nums;color:var(--dim)}
  .chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel);cursor:pointer;user-select:none;font-size:13px;color:var(--dim);transition:.12s}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);color:#08111f;border-color:var(--accent);font-weight:650}
  .chip .n{opacity:.6;font-size:11px;margin-left:3px}
  .chip.on .n{opacity:.8}
  .chip.livef{border-color:#4a2530}
  .chip.livef.on{background:var(--live);border-color:var(--live);color:#fff}

  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:14px 16px 40px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;
    display:flex;flex-direction:column;min-height:0}
  .card.crypto{border-color:#2a2f1f;background:linear-gradient(160deg,#161a10,#141924)}
  .chead{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:11px;color:var(--dim)}
  .badge{padding:2px 8px;border-radius:6px;background:var(--panel2);font-weight:600;letter-spacing:.2px}
  .badge.cat{color:var(--accent)}
  .live-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;
    background:rgba(255,77,77,.14);color:#ff7a7a;font-weight:700}
  .live-badge .b{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .when{margin-left:auto;white-space:nowrap}
  .title{font-size:14.5px;font-weight:650;margin-bottom:11px;line-height:1.25}
  .rows{display:flex;flex-direction:column;gap:6px;margin-top:auto}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 11px;border-radius:10px;background:var(--panel2);position:relative;overflow:hidden}
  .row .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .nm.draw{color:var(--gold)}
  .pr{font-variant-numeric:tabular-nums;font-weight:750;font-size:19px;letter-spacing:-.5px;white-space:nowrap}
  .pr .u{font-size:11px;color:var(--dim);font-weight:600;margin-left:1px}
  .arw{font-size:11px;margin-left:6px;width:8px;display:inline-block}
  .up{color:var(--up)} .down{color:var(--down)}
  .flash-up{animation:fu .55s} .flash-down{animation:fd .55s}
  @keyframes fu{0%{background:rgba(46,230,160,.32)}100%{background:var(--panel2)}}
  @keyframes fd{0%{background:rgba(255,92,122,.32)}100%{background:var(--panel2)}}
  .updown .nm::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .updown.up-row .nm::before{background:var(--up)} .updown.down-row .nm::before{background:var(--down)}
  .empty{grid-column:1/-1;color:var(--dim);text-align:center;padding:60px 20px}
  .empty b{color:var(--txt)}
  .sec-label{grid-column:1/-1;font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;margin:6px 2px -2px;display:flex;align-items:center;gap:8px}
  .sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><span class="z">⚡</span> Polymarket Live</h1>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" placeholder="Search team, player, market…" autocomplete="off" spellcheck="false"/>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="stat">connecting…</span><span class="lat" id="lat"></span></div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="board"><div class="empty">Loading live Polymarket markets…</div></main>

<script>
const GAMMA='https://gamma-api.polymarket.com';
const WS_URL='wss://ws-subscriptions-clob.polymarket.com/ws/market';
const LIST_REFRESH_MS=30000;   // how often we re-scan which games exist (prices are live via WS regardless)
// CURATED priority tags only — top soccer competitions, major esports titles,
// and NBA/EuroLeague. Deliberately excludes minor-country soccer, tennis,
// NFL, PUBG/Free Fire etc. to stay fast and focused. Empty tags (off-season /
// preseason) cost one cheap request and light up automatically when games open.
const SOCCER_TAGS=['ucl','uefa-champions-league','europa-league','uefa-europa-league','conference-league','premier-league','epl','la-liga','bundesliga','serie-a','ligue-1','mls'];
const ESPORTS_TAGS=['league-of-legends','dota-2','valorant','counter-strike','cs2'];
const HOOPS_TAGS=['nba','euroleague'];
const BASEBALL_TAGS=['mlb'];   // MLB only — the generic 'baseball' tag drags in minor/foreign leagues
const PRIORITY_TAGS=[...SOCCER_TAGS, ...ESPORTS_TAGS, ...HOOPS_TAGS, ...BASEBALL_TAGS];
const MAX_PAGES=5;             // per-tag pagination depth (100 events/page)

// ---------- categories ----------
const CATS=[
  {key:'crypto',   label:'⚡ Crypto',    tags:[]},
  {key:'soccer',   label:'⚽ Soccer',    tags:['soccer']},
  {key:'basketball',label:'🏀 Basketball',tags:['basketball','nba','wnba','ncaab','euroleague']},
  {key:'football', label:'🏈 Football',  tags:['nfl','americanfootball','ncaaf','cfb','college-football']},
  {key:'baseball', label:'⚾ Baseball',  tags:['mlb','baseball','npb']},
  {key:'hockey',   label:'🏒 Hockey',    tags:['nhl','hockey']},
  {key:'tennis',   label:'🎾 Tennis',    tags:['tennis']},
  {key:'combat',   label:'🥊 Combat',    tags:['mma','ufc','boxing']},
  {key:'cricket',  label:'🏏 Cricket',   tags:['cricket']},
  {key:'golf',     label:'⛳ Golf',      tags:['golf','pga']},
  {key:'racing',   label:'🏁 Racing',    tags:['f1','formula-1','nascar','racing','motogp']},
  {key:'esports',  label:'🎮 Esports',   tags:['esports','league-of-legends','dota-2','counter-strike','cs2','valorant','rocket-league','overwatch']},
  {key:'other',    label:'• Other',      tags:[]},
];
const CAT_LABEL=Object.fromEntries(CATS.map(c=>[c.key,c.label]));
function categorize(tagSlugs){
  for(const c of CATS){ if(c.key!=='crypto'&&c.key!=='other'&&c.tags.some(t=>tagSlugs.includes(t))) return c.key; }
  return 'other';
}

// ---------- state ----------
const board=new Map();   // eventId -> {el, cat, live, startMs, vol, searchText, outcomes:[{tokenId,label,prob,prev,prEl,rowEl}]}
const tokenMap=new Map();// tokenId -> {eventId, idx}
const books=new Map();   // tokenId -> {bids:Map, asks:Map}
let ws=null, reconnectT=null, lastMsgAt=0;
let activeCat='all', queryText='', liveOnly=false;

function jparse(s,d){try{return JSON.parse(s)}catch{return d}}
function cleanLabel(s){return (s||'').replace(/\s*\(.*\)\s*$/,'').trim();}

// ---------- fetching the market list ----------
// Fetch every page of one tag (deep enough to include all of that sport).
async function fetchTagAll(tag, maxPages=MAX_PAGES){
  const out=[];
  for(let off=0; off<maxPages*100; off+=100){
    const evs=await fetch(`${GAMMA}/events?tag_slug=${tag}&active=true&closed=false&limit=100&offset=${off}&order=volume24hr&ascending=false`).then(r=>r.ok?r.json():[]).catch(()=>[]);
    if(!Array.isArray(evs)||!evs.length) break;
    out.push(...evs);
    if(evs.length<100) break;
  }
  return out;
}
function extractSport(ev){
  const ml=(ev.markets||[]).filter(m=>m.sportsMarketType==='moneyline'&&m.active!==false&&m.closed!==true&&m.acceptingOrders!==false&&m.clobTokenIds);
  if(!ml.length) return null;
  let outs;
  if(ml.length===1){
    const m=ml[0], names=jparse(m.outcomes,[]), toks=jparse(m.clobTokenIds,[]), pr=jparse(m.outcomePrices,[]);
    if(names[0]==='Yes') return null; // lone yes/no isn't a full match
    outs=names.map((o,i)=>({label:o,tokenId:toks[i],prob:pr[i]!=null?+pr[i]:null}));
  }else{
    outs=ml.map(m=>{const toks=jparse(m.clobTokenIds,[]),pr=jparse(m.outcomePrices,[]);
      return {label:cleanLabel(m.groupItemTitle),tokenId:toks[0],prob:pr[0]!=null?+pr[0]:null};});
  }
  outs=outs.filter(o=>o.tokenId&&o.label);
  if(outs.length<2||outs.length>3) return null;  // real match moneyline only
  // draw last for 3-way readability
  outs.sort((a,b)=>(/^draw$/i.test(a.label)?1:0)-(/^draw$/i.test(b.label)?1:0));
  return outs;
}
async function fetchCrypto(){
  const now=Date.now(), cards=[];
  for(const [asset,tag] of [['BTC','bitcoin'],['ETH','ethereum']]){
    const evs=await fetch(`${GAMMA}/events?tag_slug=${tag}&active=true&closed=false&limit=40&order=liquidity&ascending=false`).then(r=>r.ok?r.json():[]).catch(()=>[]);
    // Up/Down are short recurring windows. Keep only ones whose window hasn't
    // ended yet (drops stale never-closed leftovers pinned at 0/100), then pick
    // the one in play now (start≤now<end), else the soonest upcoming window.
    const ud=(Array.isArray(evs)?evs:[]).filter(e=>/up or down/i.test(e.title)&&e.markets?.[0]?.acceptingOrders!==false&&e.markets?.[0]?.clobTokenIds&&(Date.parse(e.endDate)||0)>now)
      .sort((a,b)=>(Date.parse(a.endDate)||0)-(Date.parse(b.endDate)||0));
    const e=ud.find(x=>(Date.parse(x.startDate)||0)<=now)||ud[0];
    if(!e) continue;
    const m=e.markets[0], names=jparse(m.outcomes,[]), toks=jparse(m.clobTokenIds,[]), pr=jparse(m.outcomePrices,[]);
    const outs=names.map((o,i)=>({label:o,tokenId:toks[i],prob:pr[i]!=null?+pr[i]:null})).filter(o=>o.tokenId);
    if(outs.length!==2) continue;
    const startMs=Date.parse(e.startDate)||0, endMs=Date.parse(e.endDate)||0;
    cards.push({id:'c_'+asset, cat:'crypto', title:`${asset} · ${e.title.replace(/^.*?Up or Down\s*-?\s*/i,'Up or Down · ')}`,
      startMs, endMs, vol:+e.liquidity||0, outcomes:outs, crypto:true, asset,
      live: startMs<=now && (!endMs||endMs>now)});
  }
  return cards;
}

function makeItem(e){
  const outs=extractSport(e); if(!outs) return null;
  const now=Date.now();
  const startMs=Date.parse(e.startDate)||0, endMs=Date.parse(e.endDate)||0;
  return {id:'e_'+e.id, cat:categorize((e.tags||[]).map(t=>t.slug)), title:e.title,
    startMs, endMs, vol:+e.volume24hr||0, outcomes:outs,
    live: startMs && startMs<=now && (!endMs||endMs>now)};
}

async function loadList(){
  try{
    const items=await fetchCrypto();
    const seen=new Set();
    // Curated priority tags only, fetched in full and deduped across overlaps
    // (e.g. ucl & uefa-champions-league, nba & euroleague, mlb & baseball).
    const batches=await Promise.all(PRIORITY_TAGS.map(t=>fetchTagAll(t)));
    for(const evs of batches) for(const e of evs){
      if(seen.has(e.id)) continue; const it=makeItem(e); if(!it) continue;
      seen.add(e.id); items.push(it);
    }
    reconcile(items);
    setStatus(ws&&ws.readyState===1);
  }catch(e){ setStatus(false,'list error'); }
}

// ---------- DOM reconcile ----------
function reconcile(items){
  const boardEl=document.getElementById('board');
  const empty=boardEl.querySelector('.empty'); if(empty) empty.remove();
  const keep=new Set(items.map(i=>i.id));
  for(const [id,c] of board){ if(!keep.has(id)){ c.el.remove(); board.delete(id);
    for(const o of c.outcomes) tokenMap.delete(o.tokenId); } }

  for(const it of items){
    let c=board.get(it.id);
    if(!c){
      const el=document.createElement('div');
      el.className='card'+(it.crypto?' crypto':'');
      el.innerHTML=`<div class="chead"></div><div class="title"></div><div class="rows"></div>`;
      c={el, outcomes:[]};
      board.set(it.id,c);
      el.querySelector('.title').textContent=it.title;
    }
    c.cat=it.cat; c.live=it.live; c.startMs=it.startMs; c.endMs=it.endMs; c.vol=it.vol; c.crypto=it.crypto;
    c.searchText=(it.title+' '+it.outcomes.map(o=>o.label).join(' ')+' '+CAT_LABEL[it.cat]).toLowerCase();
    // header
    c.el.querySelector('.chead').innerHTML =
      `<span class="badge cat">${CAT_LABEL[it.cat]||it.cat}</span>`+
      (it.live?`<span class="live-badge"><span class="b"></span>LIVE</span>`:'')+
      `<span class="when">${whenText(it)}</span>`;
    // rows
    const rowsEl=c.el.querySelector('.rows');
    if(c.outcomes.length!==it.outcomes.length){ rowsEl.innerHTML=''; c.outcomes=[]; }
    it.outcomes.forEach((o,i)=>{
      let ro=c.outcomes[i];
      if(!ro){
        const row=document.createElement('div');
        const isDraw=/^draw$/i.test(o.label);
        row.className='row'+(it.crypto?' updown '+(o.label.toLowerCase()==='up'?'up-row':'down-row'):'');
        row.innerHTML=`<span class="nm${isDraw?' draw':''}"></span><span class="pr">—<span class="arw"></span></span>`;
        rowsEl.appendChild(row);
        ro={rowEl:row, prEl:row.querySelector('.pr'), arwEl:row.querySelector('.arw'), prob:null, prev:null};
        row.querySelector('.nm').textContent=o.label;
        c.outcomes[i]=ro;
      }
      ro.tokenId=o.tokenId; ro.label=o.label;
      tokenMap.set(o.tokenId,{eventId:it.id, idx:i});
      if(o.prob!=null && ro.prob==null) setProb(ro,o.prob*100,false);
    });
  }
  sortAndFilter();
  resubscribe();
}

function whenText(it){
  if(it.crypto && it.endMs){
    const d=it.endMs-Date.now();
    if(d<=0) return 'resolving';
    const m=Math.floor(d/60000), s=Math.round(d%60000/1000);
    return m>0?`resolves in ${m}m`:`resolves in ${s}s`;
  }
  if(it.live) return 'in play';
  if(!it.startMs) return '';
  const d=it.startMs-Date.now();
  if(d<0) return 'started';
  const h=Math.floor(d/3600000), m=Math.round(d%3600000/60000);
  if(h>=24) return new Date(it.startMs).toLocaleDateString([], {month:'short',day:'numeric'});
  if(h>=1) return `in ${h}h ${m}m`;
  return `in ${m}m`;
}

// ---------- sort + filter (only on reconcile / user input, not per tick) ----------
function sortAndFilter(){
  const boardEl=document.getElementById('board');
  const arr=[...board.values()];
  arr.sort((a,b)=>{
    if(!!b.crypto - !!a.crypto) return !!b.crypto - !!a.crypto; // crypto pinned top
    if(!!b.live - !!a.live) return !!b.live - !!a.live;         // live next
    const as=a.startMs||Infinity, bs=b.startMs||Infinity;
    if(a.live&&b.live) return b.vol-a.vol;                      // both live -> volume
    return as-bs;                                               // else soonest first
  });
  let shown=0;
  for(const c of arr){
    const ok=(activeCat==='all'||c.cat===activeCat)&&(!liveOnly||c.live||c.crypto)&&(!queryText||c.searchText.includes(queryText));
    c.el.style.display=ok?'':'none';
    if(ok){ boardEl.appendChild(c.el); shown++; }
  }
  renderChips();
  let e=boardEl.querySelector('.empty');
  if(!shown){ if(!e){e=document.createElement('div');e.className='empty';boardEl.appendChild(e);}
    e.innerHTML=`No markets match <b>${queryText||CAT_LABEL[activeCat]||''}</b>.`; }
  else if(e) e.remove();
}

function renderChips(){
  const counts={all:0}; for(const c of board.values()){ counts.all++; counts[c.cat]=(counts[c.cat]||0)+1; }
  const el=document.getElementById('chips');
  const cats=[['all','All'],...CATS.map(c=>[c.key,c.label]).filter(([k])=>counts[k])];
  el.innerHTML=`<span class="chip livef${liveOnly?' on':''}" data-live="1">🔴 Live</span>`+
    cats.map(([k,l])=>`<span class="chip${activeCat===k?' on':''}" data-cat="${k}">${l}<span class="n">${counts[k]||0}</span></span>`).join('');
  el.querySelectorAll('[data-cat]').forEach(ch=>ch.onclick=()=>{activeCat=ch.dataset.cat;sortAndFilter();});
  el.querySelector('[data-live]').onclick=()=>{liveOnly=!liveOnly;sortAndFilter();};
}

// ---------- price rendering ----------
function setProb(ro, prob, flash=true){
  const prev=ro.prob;
  ro.prEl.firstChild.textContent=prob.toFixed(1);
  if(!ro.prEl.querySelector('.u')){ const u=document.createElement('span');u.className='u';u.textContent='¢';ro.prEl.insertBefore(u,ro.arwEl);}
  if(flash && prev!=null && Math.abs(prob-prev)>=0.05){
    const up=prob>prev; const r=ro.rowEl;
    r.classList.remove('flash-up','flash-down'); void r.offsetWidth;
    r.classList.add(up?'flash-up':'flash-down');
    ro.arwEl.textContent=up?'▲':'▼'; ro.arwEl.className='arw '+(up?'up':'down');
  }
  ro.prob=prob;
}

// ---------- websocket: the millisecond channel ----------
function connectWs(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{ setStatus(true); resubscribe(); };
  ws.onclose=()=>{ setStatus(false,'reconnecting…'); clearTimeout(reconnectT); reconnectT=setTimeout(connectWs,1200); };
  ws.onerror=()=>{ try{ws.close()}catch{} };
  ws.onmessage=onMsg;
}
function resubscribe(){
  if(!ws||ws.readyState!==1) return;
  const ids=[...tokenMap.keys()];
  if(ids.length) ws.send(JSON.stringify({assets_ids:ids, type:'market'}));
}
function bestMid(tokenId){
  const b=books.get(tokenId); if(!b) return null;
  let bid=null,ask=null;
  for(const [p,s] of b.bids) if(s>0){const n=+p; if(bid===null||n>bid)bid=n;}
  for(const [p,s] of b.asks) if(s>0){const n=+p; if(ask===null||n<ask)ask=n;}
  return bid!=null&&ask!=null?(bid+ask)/2:(bid??ask);
}
function onMsg(ev){
  lastMsgAt=Date.now();
  let arr; try{arr=JSON.parse(ev.data)}catch{return}
  if(!Array.isArray(arr)) arr=[arr];
  const touched=new Set();
  for(const e of arr){
    const id=e.asset_id; if(!id||!tokenMap.has(id)) continue;
    let bk=books.get(id); if(!bk){bk={bids:new Map(),asks:new Map()};books.set(id,bk);}
    if(e.event_type==='book'){
      bk.bids.clear();bk.asks.clear();
      for(const l of e.bids||[]) bk.bids.set(l.price,+l.size);
      for(const l of e.asks||[]) bk.asks.set(l.price,+l.size);
    }else if(e.event_type==='price_change'){
      for(const ch of (e.changes||(e.price!=null?[e]:[]))){
        const side=(ch.side||'').toUpperCase()==='SELL'?'asks':'bids';
        const sz=+ch.size; if(sz>0) bk[side].set(ch.price,sz); else bk[side].delete(ch.price);
      }
    } else continue;
    touched.add(id);
  }
  for(const id of touched){
    const ref=tokenMap.get(id); const c=board.get(ref.eventId); if(!c) continue;
    const ro=c.outcomes[ref.idx]; if(!ro) continue;
    const mid=bestMid(id); if(mid==null) continue;
    setProb(ro, mid*100);
  }
}

// ---------- status / latency ----------
function setStatus(on,text){
  document.getElementById('dot').className='dot'+(on?' on':'');
  document.getElementById('stat').textContent=text||(on?`live · ${board.size} markets`:'offline');
}
setInterval(()=>{
  const el=document.getElementById('lat');
  if(!lastMsgAt){el.textContent='';return;}
  const ms=Date.now()-lastMsgAt;
  el.textContent=ms<1000?`· ${ms}ms`:`· ${(ms/1000).toFixed(1)}s`;
  el.style.color=ms<1500?'var(--up)':'var(--dim)';
},200);

// ---------- search ----------
document.getElementById('q').oninput=e=>{queryText=e.target.value.trim().toLowerCase();sortAndFilter();};

// ---------- boot ----------
connectWs();
loadList();
setInterval(loadList, LIST_REFRESH_MS);   // refresh which games exist; prices stream via WS
</script>
</body>
</html>
